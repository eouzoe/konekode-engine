[package]
name = "konekode-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
konekode-flow = { path = "../crates/flow" }
konekode-record = { path = "../crates/record" }
libfuzzer-sys = "0.4"
serde_json = "1"

[workspace]

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "collect"
path = "fuzz_targets/collect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "order"
path = "fuzz_targets/order.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine"
path = "fuzz_targets/engine.rs"
test = false
doc = false
bench = false
