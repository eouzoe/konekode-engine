name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: just,wasm-bindgen@0.2.130
      - run: rustup toolchain install
      - name: Refuse a tag that is not the crate version
        run: test "$GITHUB_REF_NAME" = "v$(just version)"
      - run: just package
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.tgz
      - name: Publish the package on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tgz
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes "Built from $GITHUB_SHA by this workflow. Verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
